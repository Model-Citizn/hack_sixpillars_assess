document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

erif,system-ui,-apple-system,sans-serif;position:relative;\">\n  <div style=\"position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 50% at 15% 0%, rgba(240,101,63,0.16), transparent 60%), radial-gradient(50% 50% at 90% 10%, rgba(111,147,189,0.14), transparent 55%), radial-gradient(70% 60% at 50% 100%, rgba(240,101,63,0.08), transparent 60%);\"><\u002Fdiv>\n\n  <header style=\"position:relative;z-index:1;padding:56px 20px 40px;text-align:center;border-bottom:1px solid #2c3a55;\">\n    <div style=\"max-width:1280px;margin:0 auto;\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;border:1px solid #2c3a55;background:#19233b;font:500 12px/1 'Geist',sans-serif;color:#7e8aa3;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:20px;\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f0653f\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275z\"><\u002Fpath><\u002Fsvg>\n        <span>Model Citizn<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font:600 44px/1.05 'Fraunces',Georgia,'Times New Roman',serif;letter-spacing:-0.02em;margin:0;text-wrap:balance;\">HACK &amp; Six Pillars <span style=\"color:#f0653f;\">Assessment<\u002Fspan><\u002Fh1>\n      <p style=\"font:400 17px/1.6 'Geist',sans-serif;color:#aab6cc;margin-top:12px;max-width:560px;margin-left:auto;margin-right:auto;\">Where are you on the AI journey — and how strong is your practitioner skill profile? 51 questions across the HACK framework and the Six Pillars of the AI-Powered Professional.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"position:relative;z-index:1;max-width:720px;margin:0 auto;padding:24px 20px 64px;\">\n    <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"position:sticky;top:0;z-index:20;background:linear-gradient(#0c1220,#0c1220 80%,transparent);padding:12px 0 16px;\">\n          <div style=\"height:6px;background:#19233b;border-radius:999px;overflow:hidden;border:1px solid #2c3a55;\">\n            <div style=\"height:100%;border-radius:999px;background:linear-gradient(90deg,#f0653f,#6f93bd);transition:width 0.4s ease;width:{{ progressPctStr }};\"><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"text-align:center;font-size:12px;font-weight:500;color:#7e8aa3;margin-top:8px;\">{{ progressLabel }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:24px;\">\n          <div style=\"background:#223049;padding:14px 20px;border-radius:16px 16px 0 0;font:600 15px/1.3 'Geist',sans-serif;color:#eef2f8;border-bottom:1px solid #2c3a55;\">Your Details<\u002Fdiv>\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px;background:#19233b;border:1px solid #2c3a55;border-radius:0 0 16px 16px;\">\n            <sc-for list=\"{{ detailFields }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:13px;font-weight:600;color:#6f93bd;\">{{ f.label }}<\u002Flabel>\n                <input type=\"{{ f.type }}\" placeholder=\"{{ f.placeholder }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:100%;padding:10px 14px;border:1px solid #2c3a55;border-radius:8px;font-size:14px;font-family:'Geist',sans-serif;background:#223049;color:#eef2f8;outline:none;\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ sections }}\" as=\"section\" hint-placeholder-count=\"10\">\n          <sc-if value=\"{{ section.partLabel }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:500 12px/1 'Geist',sans-serif;color:#7e8aa3;text-transform:uppercase;letter-spacing:0.05em;margin:32px 4px 12px;display:flex;align-items:center;gap:10px;\">\n              <span>{{ section.partLabel }}<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#2c3a55;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-bottom:24px;\">\n            <div style=\"background:#223049;padding:14px 20px;border-radius:16px 16px 0 0;font:600 15px/1.3 'Geist',sans-serif;color:#eef2f8;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2c3a55;\">\n              <span>{{ section.catName }}<\u002Fspan>\n              <span style=\"background:rgba(240,101,63,0.15);color:#f0653f;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;\">{{ section.countLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#19233b;border:1px solid #2c3a55;border-radius:0 0 16px 16px;\">\n              <sc-for list=\"{{ section.questions }}\" as=\"q\" hint-placeholder-count=\"4\">\n                <div style=\"padding:18px 20px;border-bottom:1px solid rgba(44,58,85,0.4);\">\n                  <div style=\"font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;line-height:1.4;\">\n                    <span style=\"color:#f0653f;font-weight:700;min-width:28px;font-family:'Fraunces',serif;\">{{ q.id }}<\u002Fspan>\n                    <span style=\"color:#eef2f8;\">{{ q.qtext }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ q.isChoice }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                      <sc-for list=\"{{ q.opts }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                        <div sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.rowStyle }}\" style-hover=\"border-color:#2f4663;\">\n                          <span style=\"{{ opt.dotStyle }}\"><span style=\"{{ opt.dotInnerStyle }}\"><\u002Fspan><\u002Fspan>\n                          <span>{{ opt.label }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.isScale }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div>\n                      <div style=\"display:flex;gap:6px;\">\n                        <sc-for list=\"{{ q.scaleOpts }}\" as=\"s\" hint-placeholder-count=\"5\">\n                          <div sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.val }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#7e8aa3;margin-top:6px;padding:0 4px;\">\n                        <span>No idea<\u002Fspan><span>Expert<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ q.isText }}\" hint-placeholder-val=\"{{ false }}\">\n                    <textarea placeholder=\"Your answer...\" value=\"{{ q.textValue }}\" sc-camel-on-change=\"{{ q.onChange }}\" style=\"width:100%;padding:10px 14px;border:1px solid #2c3a55;border-radius:8px;font-size:14px;font-family:'Geist',sans-serif;background:#223049;color:#eef2f8;outline:none;min-height:56px;resize:vertical;\"><\u002Ftextarea>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"padding:24px 0;text-align:center;\">\n          <button sc-camel-on-click=\"{{ submit }}\" disabled=\"{{ submitting }}\" style=\"{{ submitBtnStyle }}\">{{ submitBtnLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ hasStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ statusStyle }}\">{{ statusMsg }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:hsp-fadeIn 0.5s ease;\">\n        <div style=\"background:#19233b;border:1px solid #2c3a55;border-radius:24px;overflow:hidden;margin-bottom:32px;\">\n          <div style=\"padding:48px 32px;text-align:center;background:linear-gradient(135deg,#121a2e,#19233b);border-bottom:1px solid #2c3a55;\">\n            <h2 style=\"font:600 32px/1.1 'Fraunces',serif;letter-spacing:-0.02em;margin:0;\">Your Assessment <span style=\"color:#f0653f;\">Results<\u002Fspan><\u002Fh2>\n            <div style=\"font:700 72px/1 'Fraunces',serif;color:#f0653f;margin:24px 0 8px;font-variant-numeric:tabular-nums;\">{{ results.total }}<\u002Fdiv>\n            <div style=\"font-size:15px;color:#aab6cc;\">out of {{ results.maxPossible }} ({{ results.pctLabel }})<\u002Fdiv>\n            <div style=\"display:inline-block;padding:8px 24px;border-radius:999px;font-weight:600;font-size:15px;margin-top:16px;border:1px solid {{ results.badgeBorder }};background:{{ results.badgeBg }};color:{{ results.badgeColor }};\">{{ results.level }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:24px 32px;\">\n            <h3 style=\"font-size:15px;font-weight:600;color:#eef2f8;margin:0 0 16px;\">Category Breakdown<\u002Fh3>\n            <sc-for list=\"{{ results.catRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n              <div style=\"display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(44,58,85,0.4);\">\n                <span style=\"font-size:14px;font-weight:600;min-width:150px;color:#eef2f8;\">{{ row.cat }}<\u002Fspan>\n                <div style=\"flex:1;margin:0 16px;height:6px;background:#223049;border-radius:999px;overflow:hidden;\">\n                  <div style=\"height:100%;border-radius:999px;transition:width 0.6s ease;width:{{ row.pctStr }};background:{{ row.color }};\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:14px;font-weight:700;min-width:50px;text-align:right;font-variant-numeric:tabular-nums;color:{{ row.color }};\">{{ row.scoreLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:20px 32px;background:#223049;border-top:1px solid #2c3a55;\">\n            <h3 style=\"font-size:15px;font-weight:600;color:#eef2f8;margin:0 0 16px;\">Your HACK Focus Stage<\u002Fh3>\n            <div style=\"font:600 20px/1.2 'Fraunces',serif;color:#f0653f;margin-bottom:6px;\">{{ results.stageName }}<\u002Fdiv>\n            <p style=\"font-size:14px;color:#aab6cc;line-height:1.6;margin:0;\">{{ results.stageText }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:20px 32px;border-top:1px solid #2c3a55;\">\n            <h3 style=\"font-size:15px;font-weight:600;color:#eef2f8;margin:0 0 16px;\">Recommended Next Steps<\u002Fh3>\n            <p style=\"font-size:14px;color:#aab6cc;line-height:1.6;margin:0;\">{{ results.nextSteps }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:20px 32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;border-top:1px solid #2c3a55;\">\n            <button sc-camel-on-click=\"{{ exportCSV }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;border:1px solid #2c3a55;background:#223049;color:#eef2f8;font-weight:600;font-size:14px;font-family:'Geist',sans-serif;cursor:pointer;\">Download CSV<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ copyResults }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;border:none;background:#f0653f;color:#fff;font-weight:600;font-size:14px;font-family:'Geist',sans-serif;cursor:pointer;box-shadow:0 10px 30px -8px rgba(240,101,63,0.6);\">Copy Summary<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasStatus }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ statusStyle }}\">{{ statusMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <footer style=\"position:relative;z-index:1;text-align:center;padding:32px 20px;border-top:1px solid #2c3a55;font-size:12px;color:#7e8aa3;\">\n    <p>© 2026 <a href=\"https://www.modelcitizn.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#f0653f;text-decoration:none;\">Model Citizn<\u002Fa> · HACK &amp; Six Pillars Assessment V1.00<\u002Fp>\n    <p style=\"margin-top:4px;\">Frameworks from <em>The AI-Powered Professional<\u002Fem> · Powered by the Model Citizn Digital Worker Team<\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  static QUESTIONS = [\n    {cat:\"H — Hygiene\",id:\"H1\",q:\"How standardised are your team's core data structures (categories, naming conventions, folder hierarchies)?\",type:\"multi\",max:3,opts:[\"Every team or system is different\",\"Mostly inconsistent\",\"Partially standardised\",\"Largely standardised\",\"Fully standardised and documented\"]},\n    {cat:\"H — Hygiene\",id:\"H2\",q:\"How current is the data your team relies on for decisions?\",type:\"multi\",max:3,opts:[\"Months behind\",\"Weeks behind\",\"Usually within the month\",\"Within the week\",\"Real-time or daily — automated feeds keep it current\"]},\n    {cat:\"H — Hygiene\",id:\"H3\",q:\"Where does your working data live?\",type:\"multi\",max:3,opts:[\"Scattered files and merged-cell layouts\",\"Some structure, many competing copies\",\"Mostly structured tables\",\"Structured tables with naming conventions\",\"A single source of truth — structured, named, owned\"]},\n    {cat:\"H — Hygiene\",id:\"H4\",q:\"Rate the hygiene of your master data (contacts, products, records) — deduplicated, complete, actively maintained\",type:\"scale\",max:3},\n    {cat:\"H — Hygiene\",id:\"H5\",q:\"How many versions of the same report or dataset exist across your team right now?\",type:\"multi\",max:3,opts:[\"No idea\",\"5+\",\"3-4\",\"2 — one is the master\",\"1 — single source of truth, everyone uses it\"]},\n    {cat:\"H — Hygiene\",id:\"H6\",q:\"When someone leaves your team, how easy is it to find and pick up their work?\",type:\"multi\",max:3,opts:[\"Nearly impossible — it's on their machine\",\"Very hard — buried in email and personal folders\",\"Doable with effort\",\"Straightforward — shared drives with some structure\",\"Seamless — documented, shared, and ownership transfers automatically\"]},\n    {cat:\"H — Hygiene\",id:\"H7\",q:\"Do your spreadsheets and data files use structured tables (named ranges, Excel Tables, database-style layouts) rather than freeform layouts?\",type:\"multi\",max:3,opts:[\"No — mostly freeform with merged cells\",\"A few are structured\",\"About half\",\"Most of them\",\"All of them — structured tables are the default\"]},\n    {cat:\"H — Hygiene\",id:\"H8\",q:\"How do you handle data entry errors (typos, duplicates, wrong categories) in your core systems?\",type:\"multi\",max:3,opts:[\"We don't — they accumulate\",\"Fix them when we spot them\",\"Periodic manual clean-ups\",\"Validation rules catch most at entry\",\"Automated rules plus regular audits — errors are rare\"]},\n    {cat:\"H — Hygiene\",id:\"H9\",q:\"Is there a clear, documented owner for each of your team's key datasets?\",type:\"yesno\",max:2,opts:[\"Yes\",\"No\"]},\n    {cat:\"H — Hygiene\",id:\"H10\",q:\"When you need a number for a decision, how confident are you that the first source you check is correct and up to date?\",type:\"scale\",max:3},\n    {cat:\"H — Hygiene\",id:\"H11\",q:\"How consistent are naming conventions across your files, folders, and systems (dates, client names, project codes)?\",type:\"multi\",max:3,opts:[\"No conventions exist\",\"Some people follow their own\",\"Informal conventions most follow\",\"Documented conventions, mostly followed\",\"Enforced conventions — templates and automation keep them consistent\"]},\n    {cat:\"H — Hygiene\",id:\"H12\",q:\"How often do you discover that two people on your team are working from different versions of the same data?\",type:\"multi\",max:3,opts:[\"Weekly or more\",\"A few times a month\",\"Monthly\",\"Rarely\",\"Never — our single source of truth prevents it\"]},\n    {cat:\"H — Hygiene\",id:\"H13\",q:\"Do your core systems (CRM, project tools, shared drives) integrate with each other, or do you manually copy data between them?\",type:\"multi\",max:3,opts:[\"All manual — copy-paste between systems\",\"Mostly manual with a few exports\",\"Some integrations in place\",\"Most systems connected\",\"Fully integrated — data flows automatically between systems\"]},\n    {cat:\"H — Hygiene\",id:\"H14\",q:\"Before starting a new project or analysis, how much time do you spend cleaning and reformatting data?\",type:\"multi\",max:3,opts:[\"Most of the time goes to cleaning\",\"Significant time — hours per project\",\"Some — maybe 30 minutes\",\"Minimal — data is mostly ready\",\"None — data arrives clean and structured\"]},\n    {cat:\"H — Hygiene\",id:\"H15\",q:\"Does your team maintain a data dictionary — a documented reference that defines what each field, metric, or term means?\",type:\"multi\",max:3,opts:[\"No — definitions live in people's heads\",\"A few terms are written down somewhere\",\"A partial glossary exists but isn't maintained\",\"A data dictionary exists and is mostly current\",\"A living data dictionary — maintained, searchable, and referenced in onboarding\"]},\n    {cat:\"H — Hygiene\",id:\"H16\",q:\"Does your team have a knowledge repository (wiki, handbook, shared docs) where processes, decisions, and institutional knowledge are captured?\",type:\"multi\",max:3,opts:[\"No — knowledge lives in people's heads and email\",\"A few scattered documents exist\",\"A repository exists but is outdated or rarely used\",\"A maintained repository that most of the team uses\",\"A living knowledge base — actively updated, searchable, and part of daily workflow\"]},\n    {cat:\"A — Automation\",id:\"A1\",q:\"How much of your recurring data entry and categorisation is automated?\",type:\"multi\",max:3,opts:[\"None — all manual\",\"A little\",\"About half\",\"Most of it\",\"Nearly all — I only handle exceptions\"]},\n    {cat:\"A — Automation\",id:\"A2\",q:\"How do your recurring reports get produced?\",type:\"multi\",max:3,opts:[\"Rebuilt manually each period\",\"Copy-paste refresh\",\"Partly automated (e.g. Power Query)\",\"Mostly automated refresh\",\"Fully automated on a schedule (e.g. Power BI)\"]},\n    {cat:\"A — Automation\",id:\"A3\",q:\"Your key recurring process (e.g. month-end, campaign launch, onboarding cycle) runs on…\",type:\"multi\",max:3,opts:[\"Memory and experience\",\"A static checklist\",\"A shared digital checklist\",\"A digital checklist with owners and dependencies\",\"A self-monitoring workflow with alerts\"]},\n    {cat:\"A — Automation\",id:\"A4\",q:\"How many workflows have you automated end-to-end in the last 12 months?\",type:\"multi\",max:3,opts:[\"0\",\"1\",\"2-3\",\"4-6\",\"7+\"]},\n    {cat:\"C — Capability\",id:\"C1\",q:\"Rate your ability to verify an AI-produced formula or output by tracing the underlying logic yourself\",type:\"scale\",max:3},\n    {cat:\"C — Capability\",id:\"C2\",q:\"When you evaluate a new tool or AI vendor, you…\",type:\"multi\",max:3,opts:[\"Go on recommendations and hype\",\"Take a quick look at features and price\",\"Use a basic checklist\",\"Use structured criteria incl. security (SOC 2) and integration\",\"Run a full framework plus a pilot with success criteria\"]},\n    {cat:\"C — Capability\",id:\"C3\",q:\"Do your key models and workflows carry built-in validation checks and reconciliations?\",type:\"multi\",max:3,opts:[\"No\",\"A few manual checks\",\"In some models\",\"In most models\",\"In all of them — checks are standard practice\"]},\n    {cat:\"C — Capability\",id:\"C4\",q:\"Do you know which data is safe to put into an AI tool under your firm's policy — and what never is?\",type:\"yesno\",max:2,opts:[\"Yes\",\"No\"]},\n    {cat:\"K — Knowledge\",id:\"K1\",q:\"Your performance commentary and reporting leads with…\",type:\"multi\",max:3,opts:[\"The numbers only\",\"Numbers with brief notes\",\"Some narrative\",\"Insight and recommended actions\",\"A story the audience acts on\"]},\n    {cat:\"K — Knowledge\",id:\"K2\",q:\"Have you unlearned a long-standing method in the past year and replaced it with a better one?\",type:\"yesno\",max:2,opts:[\"Yes\",\"No\"]},\n    {cat:\"K — Knowledge\",id:\"K3\",q:\"For AI-assisted outputs in your work, review and accountability are…\",type:\"multi\",max:3,opts:[\"Never discussed\",\"Unclear\",\"Informally understood\",\"Defined for some workflows\",\"Clearly defined — a reviewer and an owner for every output\"]},\n    {cat:\"K — Knowledge\",id:\"K4\",q:\"Do you have a personal AI adoption roadmap (e.g. a 90-day plan)?\",type:\"multi\",max:3,opts:[\"No\",\"Thinking about it\",\"Rough ideas written down\",\"A plan I sometimes follow\",\"A live roadmap I work through and update\"]},\n    {cat:\"K — Knowledge\",id:\"K5\",q:\"What is the single biggest time sink in your week right now?\",type:\"text\",max:0},\n    {cat:\"P1 — Excel Fluency\",id:\"E1\",q:\"Which modern Excel functions do you actively use?\",type:\"multi\",max:3,opts:[\"None of these\",\"XLOOKUP\",\"XLOOKUP + dynamic arrays (FILTER, SORT, UNIQUE)\",\"Those plus LET\",\"Those plus LAMBDA — reusable functions\"]},\n    {cat:\"P1 — Excel Fluency\",id:\"E2\",q:\"Do you use Power Query to import and transform data from external sources into Excel?\",type:\"multi\",max:3,opts:[\"Never heard of it\",\"Aware but don't use\",\"Occasionally\",\"Regularly\",\"It's my default\"]},\n    {cat:\"P1 — Excel Fluency\",id:\"E3\",q:\"Your models separate inputs, workings and outputs, with consistent formulas across every period\",type:\"multi\",max:3,opts:[\"Never\",\"Rarely\",\"Sometimes\",\"Usually\",\"Always — it's house style\"]},\n    {cat:\"P1 — Excel Fluency\",id:\"E4\",q:\"Do you use AI (e.g. Claude) to generate, explain or debug Excel formulas?\",type:\"multi\",max:3,opts:[\"Never\",\"Tried it once or twice\",\"Sometimes — I accept the answer as-is\",\"Regularly — and I verify the result myself\",\"Core workflow, with verification built in\"]},\n    {cat:\"P2 — Process & Data\",id:\"D1\",q:\"Have you mapped a core workflow end-to-end (inputs, steps, owners, outputs)?\",type:\"multi\",max:3,opts:[\"No\",\"Partly, in my head\",\"A rough sketch exists\",\"Documented for one process\",\"Documented for several and kept current\"]},\n    {cat:\"P2 — Process & Data\",id:\"D2\",q:\"Rate your ability to trace every data point in a report back to its source\",type:\"scale\",max:3},\n    {cat:\"P2 — Process & Data\",id:\"D3\",q:\"When a process is broken, you…\",type:\"multi\",max:3,opts:[\"Throw more hours at it\",\"Patch it downstream\",\"Add a tool on top\",\"Redesign the process first\",\"Redesign, then automate — and measure before vs after\"]},\n    {cat:\"P3 — Tech Assessment\",id:\"T1\",q:\"Do you check security certifications (SOC 2, ISO 27001) and where data is stored before adopting a tool?\",type:\"yesno\",max:2,opts:[\"Yes\",\"No\"]},\n    {cat:\"P3 — Tech Assessment\",id:\"T2\",q:\"Do you know what happens to your data inside the AI tools you use (retention, training, sharing)?\",type:\"multi\",max:3,opts:[\"Never thought about it\",\"Vaguely\",\"For some tools\",\"For most tools\",\"For every tool — and it's documented\"]},\n    {cat:\"P3 — Tech Assessment\",id:\"T3\",q:\"Do you run a pilot with defined success criteria before rolling out a new tool?\",type:\"multi\",max:3,opts:[\"Never\",\"Once, informally\",\"Sometimes\",\"Usually\",\"Always — it's standard practice\"]},\n    {cat:\"P4 — AI Concepts\",id:\"AI1\",q:\"Rate your ability to explain probabilistic vs deterministic — why the same prompt can produce different answers\",type:\"scale\",max:3},\n    {cat:\"P4 — AI Concepts\",id:\"AI2\",q:\"Hallucinations…\",type:\"multi\",max:3,opts:[\"Don't know the term\",\"Have heard of them\",\"Can explain them\",\"Have personally caught one\",\"I design workflows assuming they will occur\"]},\n    {cat:\"P4 — AI Concepts\",id:\"AI3\",q:\"Do you use structured prompts (role, context, task, output format)?\",type:\"multi\",max:3,opts:[\"Never\",\"Rarely\",\"Sometimes\",\"Often\",\"Always — plus a reusable prompt library\"]},\n    {cat:\"P4 — AI Concepts\",id:\"AI4\",q:\"Human review of AI outputs in your work is…\",type:\"multi\",max:3,opts:[\"Not happening\",\"Occasional\",\"Usual\",\"Consistent\",\"Systematic — human-in-the-loop is the control framework\"]},\n    {cat:\"P4 — AI Concepts\",id:\"AI5\",q:\"Do you observe the guardrail: no unreviewed AI on high-stakes decisions (approvals, customer commitments, compliance actions, published outputs)?\",type:\"yesno\",max:2,opts:[\"Yes\",\"No\"]},\n    {cat:\"P4 — AI Concepts\",id:\"AI6\",q:\"Which AI tools do you currently use in your work, and for what?\",type:\"text\",max:0},\n    {cat:\"P5 — Growth Mindset\",id:\"G1\",q:\"How often do you set aside time to learn AI and technology skills?\",type:\"multi\",max:3,opts:[\"Never\",\"When forced to\",\"Monthly\",\"Weekly\",\"It's a daily habit\"]},\n    {cat:\"P5 — Growth Mindset\",id:\"G2\",q:\"When did you last try a new AI tool or feature?\",type:\"multi\",max:3,opts:[\"Can't remember\",\"This year\",\"This quarter\",\"This month\",\"This week\"]},\n    {cat:\"P5 — Growth Mindset\",id:\"G3\",q:\"Do you teach or share what you learn with colleagues or your community?\",type:\"yesno\",max:2,opts:[\"Yes\",\"No\"]},\n    {cat:\"P6 — Human Skills\",id:\"HU1\",q:\"Rate your data storytelling — structuring numbers into a narrative with a clear 'so what'\",type:\"scale\",max:3},\n    {cat:\"P6 — Human Skills\",id:\"HU2\",q:\"Translating technical or AI output into plain-language decisions for stakeholders is something you…\",type:\"multi\",max:3,opts:[\"Avoid\",\"Struggle with\",\"Can do with effort\",\"Do well\",\"Are known for\"]},\n    {cat:\"P6 — Human Skills\",id:\"HU3\",q:\"When the data is incomplete, you…\",type:\"multi\",max:3,opts:[\"Wait for perfect data\",\"Escalate the decision\",\"Hedge and present options only\",\"Make a call with clear caveats\",\"Make and own the call, documenting the judgement\"]}\n  ];\n  static HACK_CATS = [\"H — Hygiene\",\"A — Automation\",\"C — Capability\",\"K — Knowledge\"];\n  static PART_LABELS = { \"H — Hygiene\": \"Part A · The HACK Journey — your environment\", \"P1 — Excel Fluency\": \"Part B · The Six Pillars — your skill profile\" };\n  static NEXT_STEPS = {\n    'Novice': 'Start with Hygiene — you cannot automate a mess. Standardise your data structures, get your key data sources current, and move working data into structured tables. Master XLOOKUP and Excel Tables before building AI workflows.',\n    'Explorer': 'Lock in data hygiene, then begin Automation: automate recurring data entry, build one Power Query-refreshed report, and digitise your key process checklists. Learn structured prompting and probabilistic vs deterministic — the literacy that prevents dangerous misuse.',\n    'Practitioner': 'Build Capability: validation checks in every key model, a tool-assessment framework with a SOC 2 lens, and a reusable prompt library. Map one workflow end-to-end and automate it. Consider structured upskilling programmes to accelerate your progress.',\n    'Advanced': 'Focus on Knowledge and the human pillars: storytelling, judgement, and clear accountability for AI-assisted outputs. Design multi-step AI workflows with human-in-the-loop controls, and start measuring time savings and ROI.',\n    'Expert': 'You are operating across all four HACK stages. Coach others, embed the Six Pillars in your team\\'s operating model, and contribute skills and evals back to the community — and never move the guardrail: no unreviewed AI on high-stakes decisions.'\n  };\n  static STAGE_TEXT = {\n    'H — Hygiene': { name: 'Hygiene', text: 'Clean the data first — you cannot automate a mess. Bad data doesn\\'t produce bad output; it produces confidently wrong output that looks plausible enough to pass a casual review.' },\n    'A — Automation': { name: 'Automation', text: 'Your data is in shape — now streamline the repetitive. Automate recurring data entry, set up refreshing reports, and digitise your process checklists. Never automate before you clean; you\\'ve earned this stage.' },\n    'C — Capability': { name: 'Capability', text: 'Build the technical depth to operate the tools and verify the outputs. You cannot check outputs you don\\'t have the skills to understand — validation checks, tool assessment and AI literacy live here.' },\n    'K — Knowledge': { name: 'Knowledge', text: 'Sharpen the human edge AI cannot replicate: context, storytelling, judgement and the willingness to unlearn. This is what turns automated output into decisions people act on.' },\n    'ALL': { name: 'All four stages strong', text: 'Hygiene, Automation, Capability and Knowledge are all in place. Scale what works, govern it well, and coach others through the same journey.' }\n  };\n  static BADGES = {\n    'Novice':       { bg: 'rgba(248,113,113,0.15)', color: '#f87171', border: 'rgba(248,113,113,0.3)' },\n    'Explorer':     { bg: 'rgba(251,191,36,0.15)',  color: '#fbbf24', border: 'rgba(251,191,36,0.3)' },\n    'Practitioner': { bg: 'rgba(111,147,189,0.15)', color: '#6f93bd', border: 'rgba(111,147,189,0.3)' },\n    'Advanced':     { bg: 'rgba(52,211,153,0.15)',  color: '#34d399', border: 'rgba(52,211,153,0.3)' },\n    'Expert':       { bg: 'rgba(16,185,129,0.15)',  color: '#10b981', border: 'rgba(16,185,129,0.3)' }\n  };\n  static STATUS_COLORS = {\n    success: { bg: 'rgba(52,211,153,0.1)',  border: 'rgba(52,211,153,0.3)',  color: '#34d399' },\n    error:   { bg: 'rgba(248,113,113,0.1)', border: 'rgba(248,113,113,0.3)', color: '#f87171' },\n    sending: { bg: 'rgba(111,147,189,0.1)', border: 'rgba(111,147,189,0.3)', color: '#6f93bd' }\n  };\n  static SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzRf7odTTd_LNltNVMUEYrLW_2jWYLXHtJJwRQM1GBKyicTqP4gQotnDlfnJsX7ExHc/exec';\n  static get MAX_POSSIBLE() { return Component.QUESTIONS.reduce((s, q) => s + q.max, 0); }\n\n  state = {\n    answers: {},\n    details: { name: '', email: '', org: '', role: '', department: '' },\n    view: 'form',\n    submitting: false,\n    statusMsg: '',\n    statusType: '',\n    results: null\n  };\n\n  choose(qid, idx) { this.setState(prev => ({ answers: { ...prev.answers, [qid]: idx } })); }\n  chooseScale(qid, val) { this.setState(prev => ({ answers: { ...prev.answers, [qid]: val } })); }\n  setText(qid, val) {\n    this.setState(prev => {\n      var answers = { ...prev.answers };\n      if (val && val.trim()) answers[qid] = val.trim(); else delete answers[qid];\n      return { answers: answers };\n    });\n  }\n  setDetail(key, val) { this.setState(prev => ({ details: { ...prev.details, [key]: val } })); }\n\n  getScore(q) {\n    var val = this.state.answers[q.id];\n    if (val === undefined || q.max === 0) return 0;\n    if (q.type === 'yesno') return val === 0 ? q.max : 0;\n    if (q.type === 'scale') return Math.ceil(val * q.max / 5);\n    if (q.type === 'multi') return Math.min(val, q.max);\n    return 0;\n  }\n  getAnswerLabel(q) {\n    var val = this.state.answers[q.id];\n    if (val === undefined) return '';\n    if (q.type === 'text') return String(val);\n    if (q.type === 'scale') return String(val) + '/5';\n    if (q.opts) return q.opts[val] || '';\n    return String(val);\n  }\n  calculateScores() {\n    var self = this, total = 0, catScores = {}, catMax = {};\n    Component.QUESTIONS.forEach(function (q) {\n      var s = self.getScore(q);\n      total += s;\n      catScores[q.cat] = (catScores[q.cat] || 0) + s;\n      catMax[q.cat] = (catMax[q.cat] || 0) + q.max;\n    });\n    var pct = total / Component.MAX_POSSIBLE;\n    var level;\n    if (pct >= 0.85) level = 'Expert';\n    else if (pct >= 0.7) level = 'Advanced';\n    else if (pct >= 0.5) level = 'Practitioner';\n    else if (pct >= 0.3) level = 'Explorer';\n    else level = 'Novice';\n    return { total: total, pct: pct, level: level, catScores: catScores, catMax: catMax };\n  }\n  hackFocusStage(catScores, catMax) {\n    for (var i = 0; i < Component.HACK_CATS.length; i++) {\n      var c = Component.HACK_CATS[i];\n      if (catMax[c] > 0 && catScores[c] / catMax[c] < 0.6) return Component.STAGE_TEXT[c];\n    }\n    return Component.STAGE_TEXT.ALL;\n  }\n  barColor(cpct) { return cpct >= 70 ? '#34d399' : cpct >= 40 ? '#fbbf24' : '#f87171'; }\n\n  buildPayload(r, stage) {\n    var self = this, payload = {};\n    payload['Timestamp'] = new Date().toISOString();\n    payload['Name'] = this.state.details.name;\n    payload['Email'] = this.state.details.email;\n    payload['Organisation'] = this.state.details.org;\n    payload['Role'] = this.state.details.role;\n    payload['Department'] = this.state.details.department;\n    payload['Total Score'] = r.total;\n    payload['Max Possible'] = Component.MAX_POSSIBLE;\n    payload['Percentage'] = Math.round(r.pct * 100);\n    payload['Maturity Level'] = r.level;\n    payload['HACK Focus Stage'] = stage.name;\n    Object.keys(r.catScores).forEach(function (cat) { payload[cat] = r.catScores[cat]; });\n    Component.QUESTIONS.forEach(function (q) {\n      payload[q.id] = self.getAnswerLabel(q);\n      payload[q.id + ' pts'] = self.getScore(q);\n    });\n    return payload;\n  }\n  postToSheet(payload) {\n    try {\n      var iframe = document.getElementById('_gas_submit_hsp');\n      if (!iframe) {\n        iframe = document.createElement('iframe');\n        iframe.id = '_gas_submit_hsp';\n        iframe.name = '_gas_submit_hsp';\n        iframe.style.display = 'none';\n        document.body.appendChild(iframe);\n      }\n      var f = document.createElement('form');\n      f.method = 'POST'; f.action = Component.SHEETS_URL; f.target = '_gas_submit_hsp'; f.style.display = 'none';\n      var input = document.createElement('input');\n      input.type = 'hidden'; input.name = 'payload'; input.value = JSON.stringify(payload);\n      f.appendChild(input);\n      document.body.appendChild(f);\n      f.submit();\n      document.body.removeChild(f);\n    } catch (e) { /* ignore */ }\n  }\n  buildResultsView(r, stage) {\n    var self = this;\n    var badge = Component.BADGES[r.level];\n    var catRows = Object.keys(r.catScores).map(function (cat) {\n      var cpct = r.catMax[cat] > 0 ? Math.round(r.catScores[cat] / r.catMax[cat] * 100) : 0;\n      return { cat: cat, pctStr: cpct + '%', color: self.barColor(cpct), scoreLabel: r.catScores[cat] + '/' + r.catMax[cat] };\n    });\n    return {\n      total: r.total, maxPossible: Component.MAX_POSSIBLE, pctLabel: Math.round(r.pct * 100) + '%',\n      level: r.level, badgeBg: badge.bg, badgeColor: badge.color, badgeBorder: badge.border,\n      catRows: catRows, stageName: stage.name, stageText: stage.text, nextSteps: Component.NEXT_STEPS[r.level]\n    };\n  }\n  submit() {\n    if (this.state.submitting) return;\n    var details = this.state.details;\n    if (!details.name || !details.email) {\n      this.setState({ statusMsg: 'Please fill in your name and email.', statusType: 'error' });\n      return;\n    }\n    var scored = Component.QUESTIONS.filter(function (q) { return q.max > 0; });\n    var answers = this.state.answers;\n    var unanswered = scored.filter(function (q) { return answers[q.id] === undefined; });\n    if (unanswered.length > 5) {\n      this.setState({ statusMsg: 'Please answer more questions. ' + unanswered.length + ' scored questions are unanswered.', statusType: 'error' });\n      return;\n    }\n    this.setState({ submitting: true, statusMsg: 'Submitting your assessment...', statusType: 'sending' });\n    var r = this.calculateScores();\n    var stage = this.hackFocusStage(r.catScores, r.catMax);\n    var payload = this.buildPayload(r, stage);\n    this.postToSheet(payload);\n    var self = this;\n    setTimeout(function () {\n      self.setState({\n        submitting: false, view: 'results',\n        results: self.buildResultsView(r, stage),\n        statusMsg: 'Assessment submitted successfully!', statusType: 'success'\n      });\n    }, 1200);\n  }\n  exportCSV() {\n    var self = this;\n    var date = new Date().toISOString().split('T')[0];\n    var r = this.calculateScores();\n    var stage = this.hackFocusStage(r.catScores, r.catMax);\n    var headers = ['Name', 'Email', 'Organisation', 'Role', 'Date', 'Total Score', 'Max Possible', 'Maturity Level', 'HACK Focus Stage'];\n    Component.QUESTIONS.forEach(function (q) { headers.push(q.id); });\n    var vals = [this.state.details.name, this.state.details.email, this.state.details.org, this.state.details.role, date, r.total, Component.MAX_POSSIBLE, r.level, stage.name];\n    Component.QUESTIONS.forEach(function (q) {\n      var label = self.getAnswerLabel(q);\n      vals.push(label.indexOf(',') !== -1 ? '\"' + label.replace(/\"/g, '\"\"') + '\"' : label);\n    });\n    var csv = headers.join(',') + '\\n' + vals.join(',');\n    var blob = new Blob([csv], { type: 'text/csv' });\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement('a');\n    a.href = url;\n    a.download = 'hack_sixpillars_assessment_' + this.state.details.name.replace(/\\s+/g, '_') + '_' + date + '.csv';\n    a.click();\n    URL.revokeObjectURL(url);\n  }\n  copyResults() {\n    var self = this;\n    var r = this.calculateScores();\n    var stage = this.hackFocusStage(r.catScores, r.catMax);\n    var summary = 'HACK & Six Pillars Assessment\\n' + this.state.details.name +\n      '\\nScore: ' + r.total + '/' + Component.MAX_POSSIBLE + ' (' + Math.round(r.pct * 100) + '%)' +\n      '\\nLevel: ' + r.level + '\\nHACK Focus Stage: ' + stage.name + '\\n\\nCategory Breakdown:\\n';\n    Object.keys(r.catScores).forEach(function (cat) {\n      summary += '  ' + cat + ': ' + r.catScores[cat] + '/' + r.catMax[cat] + ' (' + Math.round(r.catScores[cat] / r.catMax[cat] * 100) + '%)\\n';\n    });\n    summary += '\\nNext Steps: ' + Component.NEXT_STEPS[r.level] +\n      '\\n\\nAssessed: ' + new Date().toLocaleDateString('en-AU') +\n      '\\nPowered by Model Citizn | www.modelcitizn.com';\n    navigator.clipboard.writeText(summary).then(function () {\n      self.setState({ statusMsg: 'Results copied to clipboard!', statusType: 'success' });\n    });\n  }\n\n  buildDetailFields() {\n    var self = this;\n    var fields = [\n      { key: 'name', label: 'Full Name *', type: 'text', placeholder: 'Your name' },\n      { key: 'email', label: 'Email *', type: 'email', placeholder: 'your@email.com' },\n      { key: 'org', label: 'Organisation', type: 'text', placeholder: 'Company name' },\n      { key: 'role', label: 'Role', type: 'text', placeholder: 'e.g. Manager, Analyst, Team Lead' },\n      { key: 'department', label: 'Department / Business Unit', type: 'text', placeholder: 'e.g. Finance, Marketing, Operations, HR' }\n    ];\n    return fields.map(function (f) {\n      return {\n        key: f.key, label: f.label, type: f.type, placeholder: f.placeholder,\n        value: self.state.details[f.key] || '',\n        onChange: function (e) { self.setDetail(f.key, e.target.value); }\n      };\n    });\n  }\n  buildSections() {\n    var self = this;\n    var groups = [];\n    var currentCat = null;\n    var group = null;\n    var catCount = {};\n    Component.QUESTIONS.forEach(function (q) { catCount[q.cat] = (catCount[q.cat] || 0) + 1; });\n    Component.QUESTIONS.forEach(function (q) {\n      if (q.cat !== currentCat) {\n        currentCat = q.cat;\n        group = { partLabel: Component.PART_LABELS[q.cat] || null, catName: q.cat, countLabel: catCount[q.cat] + ' questions', questions: [] };\n        groups.push(group);\n      }\n      var val = self.state.answers[q.id];\n      var qvm = { id: q.id, qtext: q.q, isChoice: q.type === 'multi' || q.type === 'yesno', isScale: q.type === 'scale', isText: q.type === 'text' };\n      if (qvm.isChoice) {\n        qvm.opts = q.opts.map(function (label, idx) {\n          var selected = val === idx;\n          return {\n            label: label,\n            rowStyle: 'display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid ' + (selected ? '#f0653f' : '#2c3a55') + ';border-radius:8px;cursor:pointer;transition:all 0.15s;font-size:14px;color:' + (selected ? '#eef2f8' : '#aab6cc') + ';background:' + (selected ? 'rgba(240,101,63,0.08)' : 'transparent') + ';',\n            dotStyle: 'width:18px;height:18px;border-radius:50%;border:2px solid ' + (selected ? '#f0653f' : '#2c3a55') + ';flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;background:' + (selected ? '#f0653f' : 'transparent') + ';',\n            dotInnerStyle: 'width:8px;height:8px;border-radius:50%;background:#fff;display:' + (selected ? 'block' : 'none') + ';',\n            onClick: function () { self.choose(q.id, idx); }\n          };\n        });\n      }\n      if (qvm.isScale) {\n        qvm.scaleOpts = [1, 2, 3, 4, 5].map(function (v) {\n          var selected = val === v;\n          return {\n            val: v,\n            style: 'flex:1;padding:10px 0;text-align:center;border:2px solid ' + (selected ? '#f0653f' : '#2c3a55') + ';border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:all 0.15s;color:' + (selected ? '#fff' : '#aab6cc') + ';background:' + (selected ? '#f0653f' : 'transparent') + ';',\n            onClick: function () { self.chooseScale(q.id, v); }\n          };\n        });\n      }\n      if (qvm.isText) {\n        qvm.textValue = val || '';\n        qvm.onChange = function (e) { self.setText(q.id, e.target.value); };\n      }\n      group.questions.push(qvm);\n    });\n    return groups;\n  }\n\n  renderVals() {\n    var answered = Object.keys(this.state.answers).length;\n    var pct = Math.round(answered / Component.QUESTIONS.length * 100);\n    var hasStatus = !!this.state.statusMsg;\n    var statusColors = Component.STATUS_COLORS[this.state.statusType] || Component.STATUS_COLORS.sending;\n    var self = this;\n    return {\n      showForm: this.state.view === 'form',\n      showResults: this.state.view === 'results',\n      progressPctStr: pct + '%',\n      progressLabel: answered + ' of ' + Component.QUESTIONS.length + ' answered',\n      detailFields: this.buildDetailFields(),\n      sections: this.buildSections(),\n      submit: function () { self.submit(); },\n      submitting: this.state.submitting,\n      submitBtnLabel: this.state.submitting ? 'Submitting...' : 'Submit Assessment',\n      submitBtnStyle: 'display:inline-flex;align-items:center;gap:10px;padding:16px 40px;border-radius:999px;border:none;background:' + (this.state.submitting ? '#c44e2e' : '#f0653f') + ';color:#fff;font-weight:700;font-size:16px;font-family:\\'Geist\\',sans-serif;cursor:' + (this.state.submitting ? 'not-allowed' : 'pointer') + ';box-shadow:0 10px 30px -8px rgba(240,101,63,0.6);opacity:' + (this.state.submitting ? '0.7' : '1') + ';',\n      hasStatus: hasStatus,\n      statusStyle: 'text-align:center;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:600;margin-top:16px;background:' + statusColors.bg + ';border:1px solid ' + statusColors.border + ';color:' + statusColors.color + ';',\n      statusMsg: this.state.statusMsg,\n      results: this.state.results,\n      exportCSV: function () { self.exportCSV(); },\n      copyResults: function () { self.copyResults(); }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
